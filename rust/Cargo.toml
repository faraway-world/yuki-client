[package]
name = "yuki_client"
version = "0.7.1"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.2"
rustyline = "12.0"
rustyline-derive = "0.10"
dirs = "5.0"
futures-util = "0.3"
fastembed = "5.13" 
ndarray = "0.15"
# Aligned stable version with necessary TLS features
ort = { version = "2.0.0-rc.12", features = ["download-binaries", "tls-rustls"] }
[package]
name = "yuki_client"
version = "0.6.1"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.0"
rustyline = "12.0" # For TUI input and completion
dirs = "5.0"      # For cross-platform path handling
futures-util = "0.3"
